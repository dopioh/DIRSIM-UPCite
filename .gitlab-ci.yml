image: gcc:latest

stages:
  - build
  - test
  - cleanup

compilation_job:
  stage: build
  script:
    - make
  artifacts:
    paths:
      - "*"  #fichiers générés à l'étape de test
    expire_in: 1 hour

test_job:
  stage: test
  before_script:
    - apt-get update -y
    - apt-get install -y valgrind
  script:
    - make test-mem
  dependencies:
    - compilation_job

clean_job:
  stage: cleanup
  script:
    - make clean
